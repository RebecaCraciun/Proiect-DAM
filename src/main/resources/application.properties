spring.application.name=sala-fitness

# Baza de date PostgreSQL din Sprint 1 (schema se creeaza din scriptul SQL al proiectului, nu de Hibernate)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sala_fitness
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Bucharest
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
