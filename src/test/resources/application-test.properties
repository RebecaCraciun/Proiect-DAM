# Testele ruleaza pe H2 in memorie, in modul de compatibilitate PostgreSQL; schema o genereaza Hibernate din entitati
spring.datasource.url=jdbc:h2:mem:sala_fitness;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.ro.dam.salafitness=WARN
